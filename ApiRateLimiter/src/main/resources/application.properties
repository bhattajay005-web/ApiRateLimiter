spring.application.name=ApiRateLimiter
server.port=8081

# -------------------------------------------------------------
# DATABASE CONFIGURATION (MySQL)
# Demonstrates Database Concepts:
# - HikariCP Connection Pooling (OS socket reuse & thread resource limits)
# - Relational integrity and schema migrations
# -------------------------------------------------------------
spring.datasource.url=jdbc:mysql://localhost:3306/rate_limiter_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=1364@25522x07
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
# HikariCP Connection Pool Settings (Operating System & DB Concept)
spring.datasource.hikari.pool-name=ApiRateLimiterHikariPool
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.max-lifetime=1800000

# JPA / Hibernate Settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# -------------------------------------------------------------
# REDIS CONFIGURATION
# Demonstrates In-Memory Cache (Memory Hierarchy OS Concept)
# Microsecond read/write latency vs Millisecond disk I/O
# -------------------------------------------------------------
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.timeout=2000ms
spring.data.redis.client-type=lettuce

# Disable Spring Session auto-session repository to allow custom token-based Redis session management
spring.session.store-type=none

# Logging
logging.level.in.pbl.ApiRateLimiter=INFO
